<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>STJ Media — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(1180px, calc(100% - 30px));
      margin: auto;
    }

    /* ==================================================
       LOGIN
    ================================================== */

    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: #111;
      border: 1px solid #252525;
      border-radius: 20px;
      padding: 30px;
    }

    .login-box h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .login-box p {
      color: #888;
      margin: 0 0 25px;
    }

    /* ==================================================
       HEADER
    ================================================== */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(8, 8, 8, .94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #222;
    }

    .topbar-inner {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand span {
      color: #888;
      font-weight: 400;
    }

    /* ==================================================
       INPUTS
    ================================================== */

    label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 13px;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #0b0b0b;
      border: 1px solid #303030;
      color: #fff;
      border-radius: 10px;
      padding: 12px 13px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #777;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .field {
      margin-bottom: 16px;
    }

    /* ==================================================
       BUTTONS
    ================================================== */

    .btn {
      border: 1px solid #333;
      background: #181818;
      color: #fff;
      padding: 11px 15px;
      border-radius: 10px;
      transition: .2s;
    }

    .btn:hover {
      background: #252525;
    }

    .btn-primary {
      background: #fff;
      color: #000;
      border-color: #fff;
      font-weight: 700;
    }

    .btn-primary:hover {
      background: #ddd;
    }

    .btn-danger {
      color: #ff7777;
      border-color: #542525;
    }

    .btn-success {
      color: #80e0a0;
      border-color: #285438;
    }

    .btn-small {
      padding: 8px 11px;
      font-size: 12px;
    }

    /* ==================================================
       DASHBOARD
    ================================================== */

    #dashboard {
      padding-bottom: 70px;
    }

    .hero {
      padding: 40px 0 25px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 55px);
    }

    .hero p {
      color: #888;
      margin-top: 10px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .tab {
      white-space: nowrap;
      border: 1px solid #292929;
      background: #101010;
      color: #aaa;
      padding: 10px 16px;
      border-radius: 999px;
    }

    .tab.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .panel {
      background: #101010;
      border: 1px solid #242424;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 25px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 21px;
    }

    /* ==================================================
       GRID
    ================================================== */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .full {
      grid-column: 1 / -1;
    }

    /* ==================================================
       WORK CARDS
    ================================================== */

    .work-list,
    .team-list {
      display: grid;
      gap: 14px;
    }

    .work-card,
    .team-card {
      background: #0b0b0b;
      border: 1px solid #262626;
      border-radius: 15px;
      padding: 15px;
    }

    .work-card {
      display: grid;
      grid-template-columns: 145px 1fr;
      gap: 18px;
    }

    .media-preview {
      width: 145px;
      height: 105px;
      border-radius: 10px;
      overflow: hidden;
      background: #151515;
    }

    .media-preview img,
    .media-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      font-weight: 700;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .muted {
      color: #888;
      font-size: 13px;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    /* ==================================================
       TEAM
    ================================================== */

    .team-card {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 18px;
    }

    .team-preview {
      width: 120px;
      height: 145px;
      border-radius: 12px;
      overflow: hidden;
      background: #171717;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 800;
    }

    .team-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .team-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }

    .tag {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 999px;
      background: #191919;
      color: #aaa;
      font-size: 11px;
    }

    .status-live {
      color: #75df99;
    }

    .status-archive {
      color: #e2bd69;
    }

    .status-bin {
      color: #ef7777;
    }

    /* ==================================================
       MESSAGES
    ================================================== */

    #message {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 100;
      max-width: calc(100% - 36px);
      background: #fff;
      color: #000;
      padding: 13px 17px;
      border-radius: 11px;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 700px) {

      .container {
        width: min(100% - 20px, 1180px);
      }

      .topbar-inner {
        min-height: 62px;
      }

      .panel {
        padding: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .work-card {
        grid-template-columns: 1fr;
      }

      .media-preview {
        width: 100%;
        height: 190px;
      }

      .team-card {
        grid-template-columns: 90px 1fr;
        gap: 12px;
      }

      .team-preview {
        width: 90px;
        height: 115px;
      }

      .panel-head {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<!-- ====================================================
     LOGIN SCREEN
===================================================== -->

<section id="login-screen">

  <div class="login-box">

    <h1>STJ Media</h1>

    <p>
      Admin dashboard
    </p>

    <form id="login-form">

      <div class="field">

        <label>Email</label>

        <input
          id="login-email"
          type="email"
          placeholder="Admin email"
          required
        >

      </div>

      <div class="field">

        <label>Password</label>

        <input
          id="login-password"
          type="password"
          placeholder="Password"
          required
        >

      </div>

      <button
        type="submit"
        class="btn btn-primary"
        style="width:100%;"
      >
        Login
      </button>

    </form>

    <p
      id="login-error"
      style="
        color:#ff7777;
        margin-top:15px;
        margin-bottom:0;
      "
    ></p>

  </div>

</section>


<!-- ====================================================
     DASHBOARD
===================================================== -->

<section
  id="dashboard"
  class="hidden"
>

  <header class="topbar">

    <div class="container topbar-inner">

      <div class="brand">
        STJ MEDIA
        <span>/ ADMIN</span>
      </div>

      <button
        id="logout-btn"
        class="btn btn-small"
      >
        Logout
      </button>

    </div>

  </header>


  <main class="container">

    <div class="hero">

      <h1>Dashboard</h1>

      <p>
        Manage your portfolio and team from here.
      </p>

    </div>


    <!-- ==================================================
         TABS
    =================================================== -->

    <div class="tabs">

      <button
        class="tab active"
        data-main-tab="works"
      >
        Work
      </button>

      <button
        class="tab"
        data-main-tab="team"
      >
        Team
      </button>

    </div>


    <!-- ==================================================
         WORK MANAGER
    =================================================== -->

    <section
      id="works-section"
    >

      <div class="panel">

        <div class="panel-head">

          <h2>Add New Work</h2>

        </div>

        <form id="work-form">

          <div class="form-grid">

            <div class="field">

              <label>Project Title</label>

              <input
                id="work-title"
                type="text"
                placeholder="Project name"
                required
              >

            </div>


            <div class="field">

              <label>Category</label>

              <select
                id="work-category"
                required
              >

                <option value="">
                  Select category
                </option>

                <option value="Graphic Design">
                  Graphic Design
                </option>

                <option value="Photography">
                  Photography
                </option>

                <option value="Video">
                  Video
                </option>

                <option value="Social Media">
                  Social Media
                </option>

                <option value="Branding">
                  Branding
                </option>

                <option value="Other">
                  Other
                </option>

              </select>

            </div>


            <div class="field full">

              <label>Description</label>

              <textarea
                id="work-description"
                placeholder="Short description"
              ></textarea>

            </div>


            <div class="field">

              <label>Image / Video</label>

              <input
                id="work-file"
                type="file"
                accept="image/*,video/*"
                required
              >

            </div>


            <div
              class="field"
              style="
                display:flex;
                align-items:end;
              "
            >

              <button
                type="submit"
                class="btn btn-primary"
                style="width:100%;"
              >
                Upload Work
              </button>

            </div>

          </div>

        </form>

      </div>


      <div class="panel">

        <div class="panel-head">

          <h2>Manage Work</h2>

          <button
            id="refresh-works"
            class="btn btn-small"
          >
            Refresh
          </button>

        </div>


        <div class="tabs">

          <button
            class="tab work-status-tab active"
            data-work-status="live"
          >
            Live
          </button>

          <button
            class="tab work-status-tab"
            data-work-status="archive"
          >
            Archive
          </button>

          <button
            class="tab work-status-tab"
            data-work-status="bin"
          >
            Bin
          </button>

        </div>


        <div
          id="work-list"
          class="work-list"
        ></div>

      </div>

    </section>


    <!-- ==================================================
         TEAM MANAGER
    =================================================== -->

    <section
      id="team-section"
      class="hidden"
    >

      <!-- ADD / EDIT TEAM -->

      <div class="panel">

        <div class="panel-head">

          <div>

            <h2 id="team-form-heading">
              Add Team Member
            </h2>

            <p
              class="muted"
              style="margin:7px 0 0;"
            >
              Everything here is editable from the admin panel.
            </p>

          </div>

          <button
            id="team-cancel-edit"
            type="button"
            class="btn btn-small hidden"
          >
            Cancel Edit
          </button>

        </div>


        <form id="team-form">

          <input
            id="team-id"
            type="hidden"
          >


          <div class="form-grid">


            <div class="field">

              <label>Name</label>

              <input
                id="team-name"
                type="text"
                placeholder="Team member name"
                required
              >

            </div>


            <div class="field">

              <label>Role</label>

              <input
                id="team-role"
                type="text"
                placeholder="Graphic Designer · Editor"
              >

            </div>


            <div class="field full">

              <label>Work / About</label>

              <textarea
                id="team-work"
                placeholder="What does this person do?"
              ></textarea>

            </div>


            <div class="field">

              <label>Skills</label>

              <input
                id="team-skills"
                type="text"
                placeholder="Photoshop, Premiere Pro, Camera"
              >

            </div>


            <div class="field">

              <label>Display Order</label>

              <input
                id="team-order"
                type="number"
                min="0"
                value="0"
              >

            </div>


            <div class="field">

              <label>Instagram URL</label>

              <input
                id="team-instagram"
                type="url"
                placeholder="https://instagram.com/..."
              >

            </div>


            <div class="field">

              <label>LinkedIn URL</label>

              <input
                id="team-linkedin"
                type="url"
                placeholder="https://linkedin.com/in/..."
              >

            </div>


            <div class="field full">

              <label>
                Photo
                <span
                  id="team-photo-label"
                  class="muted"
                >
                  — select when adding/changing photo
                </span>
              </label>

              <input
                id="team-photo"
                type="file"
                accept="image/*"
              >

            </div>


            <div class="field full">

              <button
                type="submit"
                id="team-save-btn"
                class="btn btn-primary"
              >
                Add Team Member
              </button>

            </div>

          </div>

        </form>

      </div>


      <!-- TEAM LIST -->

      <div class="panel">

        <div class="panel-head">

          <div>

            <h2>Manage Team</h2>

            <p
              class="muted"
              style="margin:7px 0 0;"
            >
              Add, edit, archive, restore or permanently delete members.
            </p>

          </div>

          <button
            id="refresh-team"
            class="btn btn-small"
          >
            Refresh
          </button>

        </div>


        <div class="tabs">

          <button
            class="tab team-status-tab active"
            data-team-status="live"
          >
            Live
          </button>

          <button
            class="tab team-status-tab"
            data-team-status="archive"
          >
            Archive
          </button>

          <button
            class="tab team-status-tab"
            data-team-status="bin"
          >
            Bin
          </button>

        </div>


        <div
          id="team-list"
          class="team-list"
        ></div>

      </div>

    </section>

  </main>

</section>


<div
  id="message"
  class="hidden"
></div>


<script>
/* ======================================================

/* ======================================================
   HELPERS
====================================================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function safeURL(value) {

  const text =
    String(value || "").trim();

  if (!text) {
    return "";
  }

  try {

    const url =
      new URL(text);

    if (
      url.protocol === "http:" ||
      url.protocol === "https:"
    ) {
      return url.href;
    }

    return "";

  } catch {

    return "";
  }
}


function showMessage(
  message,
  duration = 3000
) {

  messageBox.textContent =
    message;

  messageBox.classList.remove(
    "hidden"
  );

  clearTimeout(
    window.__stjMessageTimer
  );

  window.__stjMessageTimer =
    setTimeout(() => {

      messageBox.classList.add(
        "hidden"
      );

    }, duration);
}
