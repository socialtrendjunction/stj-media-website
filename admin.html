<script>
document.addEventListener("DOMContentLoaded", function () {

  const email = document.getElementById("email");
  const password = document.getElementById("password");

  const loginButton = [...document.querySelectorAll("button")]
    .find(b => b.textContent.trim() === "Login to Dashboard");

  if (!email || !password || !loginButton) {
    console.error("STJ Login elements not found");
    return;
  }

  loginButton.onclick = async function (event) {

    event.preventDefault();

    const emailValue = email.value.trim();
    const passwordValue = password.value;

    if (!emailValue || !passwordValue) {
      alert("Email aur password enter karo.");
      return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";

    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: emailValue,
          password: passwordValue
        });

      if (error) {
        alert("Login failed:\n" + error.message);
        return;
      }

      if (data.session) {

        // Existing admin code ko session mil jayega
        location.reload();

      } else {

        alert("Login session nahi mili.");

      }

    } catch (error) {

      console.error(error);
      alert("Login error:\n" + error.message);

    } finally {

      loginButton.disabled = false;
      loginButton.textContent = "Login to Dashboard";

    }

  };

});
</script>
