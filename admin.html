<title>STJ Media — Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#0b0b0b;
  color:#fff;

}

.wrap{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:25px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0 30px;
  border-bottom:1px solid #292929;
}

header a{
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}

header span{
  color:#777;
  font-size:12px;
  letter-spacing:2px;
}

.card{
  background:#151515;
  border:1px solid #292929;
  border-radius:20px;
  padding:30px;
  margin-top:25px;
}

.login-card{
  max-width:430px;
  margin:80px auto 0;
  text-align:center;
}

.logo{
  width:80px;
  height:80px;
  object-fit:contain;
  margin-bottom:15px;
}

.eyebrow{
  color:#888;
  font-size:12px;
  letter-spacing:2px;
}

h1{
  font-size:36px;
  margin:10px 0;
}

h2{
  margin-top:0;
}

.muted{
  color:#888;
  line-height:1.6;
}
