<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STJ Media — Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:25px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0 30px;
  border-bottom:1px solid #292929;
}

header a{
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}

header span{
  color:#777;
  font-size:12px;
  letter-spacing:2px;
}

.card{
  background:#151515;
  border:1px solid #292929;
  border-radius:20px;
  padding:30px;
  margin-top:25px;
}

.login-card{
  max-width:430px;
  margin:80px auto 0;
  text-align:center;
}

.logo{
  width:80px;
  height:80px;
  object-fit:contain;
}

.eyebrow{
  color:#888;
  font-size:12px;
  letter-spacing:2px;
}

h1{
  font-size:36px;
  margin:10px 0;
}

h2{
  margin-top:0;
}

.muted{
  color:#888;
  line-height:1.6;
}

input,select,textarea{
  width:100%;
  padding:15px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #333;
  background:#0d0d0d;
  color:#fff;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.85;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.hidden{
  display:none!important;
}

#error{
  color:#ff7070;
  margin-top:15px;
}

#message{
  margin-top:15px;
  line-height:1.5;
}

.success{
  color:#6cff9b;
}

.error{
  color:#ff7070;
}

.dashboard-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logout{
  width:auto;
  padding:12px 20px;
  background:transparent;
  color:#fff;
  border:1px solid #444;
}

.work-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:18px;
  margin-top:20px;
}

.work{
  background:#0d0d0d;
  border:1px solid #292929;
  border-radius:14px;
  overflow:hidden;
}

.work-media{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  display:block;
  background:#111;
}

.work-info{
  padding:15px;
}

.work-info h3{
  margin:0 0 6px;
}

.work-info small{
  color:#888;
  text-transform:uppercase;
}

.delete-btn{
  background:#191919;
  color:#ff7070;
  border:1px solid #333;
}

.file-name{
  color:#888;
  font-size:13px;
  margin-top:5px;
}

@media(max-width:600px){
  .wrap{padding:15px}
  .card{padding:22px}
  h1{font-size:30px}
  .dashboard-head{align-items:flex-start}
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <a href="index.html">← STJ Media</a>
  <span>ADMIN PANEL</span>
</header>

<!-- LOGIN -->
<section id="loginBox" class="card login-card">

  <img src="stj-logo.png" class="logo" alt="STJ Media">

  <p class="eyebrow">STJ MEDIA · PRIVATE AREA</p>

  <h1>Admin Login</h1>

  <p class="muted">
    Login with your STJ Media admin account.
  </p>

  <input
    id="email"
    type="email"
    placeholder="Admin email"
    autocomplete="email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button id="loginBtn">Login to Dashboard</button>

  <p id="error"></p>

</section>


<!-- DASHBOARD -->
<section id="dashboard" class="hidden">

  <div class="dashboard-head">

    <div>
      <p class="eyebrow">STJ MEDIA</p>
      <h1>Admin Dashboard</h1>
      <p class="muted">
        Upload and manage your portfolio.
      </p>
    </div>

    <button id="logoutBtn" class="logout">
      Logout
    </button>

  </div>


  <!-- ADD WORK -->
  <div class="card">

    <h2>Add New Work</h2>

    <p class="muted">
      Upload a photo or video and publish it to your portfolio.
    </p>

    <input
      id="title"
      type="text"
      placeholder="Project title"
    >

    <select id="category">
      <option value="design">Graphic Design</option>
      <option value="shoot">Photo & Video</option>
      <option value="edit">Video Editing</option>
      <option value="social">Social Media</option>
    </select>

    <textarea
      id="description"
      placeholder="Short description (optional)"
    ></textarea>

    <input
      id="mediaFile"
      type="file"
      accept="image/*,video/*"
    >

    <div id="fileName" class="file-name"></div>

    <button id="uploadBtn">
      Upload & Publish
    </button>

    <div id="message"></div>

  </div>


  <!-- EXISTING WORK -->
  <div class="card">

    <h2>Published Work</h2>

    <div id="workList" class="work-list">
      <p class="muted">Loading...</p>
    </div>

  </div>

</section>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://acuszwigwpfrumkhtdeh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_nXq7buM0ASGpEvRq_12VDQ_yLUkGIo2";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const loginBox =
  document.getElementById("loginBox");

const dashboard =
  document.getElementById("dashboard");

const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const errorBox =
  document.getElementById("error");

const titleInput =
  document.getElementById("title");

const categoryInput =
  document.getElementById("category");

const descriptionInput =
  document.getElementById("description");

const mediaFile =
  document.getElementById("mediaFile");

const uploadBtn =
  document.getElementById("uploadBtn");

const message =
  document.getElementById("message");

const workList =
  document.getElementById("workList");

const fileName =
  document.getElementById("fileName");


function showDashboard(){

  loginBox.classList.add("hidden");
  dashboard.classList.remove("hidden");

  loadWorks();
}


function showLogin(){

  loginBox.classList.remove("hidden");
  dashboard.classList.add("hidden");
}


async function checkUser(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth.getSession();

  if(session){
    showDashboard();
  }else{
    showLogin();
  }
}


loginBtn.addEventListener(
  "click",
  async function(){

    errorBox.innerText = "";

    const userEmail =
      email.value.trim();

    const userPassword =
      password.value;

    if(!userEmail || !userPassword){

      errorBox.innerText =
        "Email aur password enter karo.";

      return;
    }

    loginBtn.disabled = true;
    loginBtn.innerText = "Logging in...";

    const {
      error:loginError
    } =
    await supabaseClient.auth.signInWithPassword({

      email:userEmail,
      password:userPassword

    });


    if(loginError){

      errorBox.innerText =
        loginError.message;

      loginBtn.disabled = false;
      loginBtn.innerText =
        "Login to Dashboard";

      return;
    }

    loginBtn.disabled = false;
    loginBtn.innerText =
      "Login to Dashboard";

    showDashboard();

  }
);


logoutBtn.addEventListener(
  "click",
  async function(){

    await supabaseClient.auth.signOut();

    email.value = "";
    password.value = "";

    showLogin();

  }
);


mediaFile.addEventListener(
  "change",
  function(){

    if(mediaFile.files.length){

      fileName.innerText =
        mediaFile.files[0].name;

    }else{

      fileName.innerText = "";

    }

  }
);


uploadBtn.addEventListener(
  "click",
  async function(){

    message.innerText = "";
    message.className = "";

    const title =
      titleInput.value.trim();

    const category =
      categoryInput.value;

    const description =
      descriptionInput.value.trim();

    const file =
      mediaFile.files[0];


    if(!title){

      message.className = "error";
      message.innerText =
        "Project title enter karo.";

      return;
    }


    if(!file){

      message.className = "error";
      message.innerText =
        "Photo ya video select karo.";

      return;
    }


    uploadBtn.disabled = true;
    uploadBtn.innerText =
      "Uploading...";


    try{

      const {
        data:{
          user
        }
      } =
      await supabaseClient.auth.getUser();


      if(!user){

        throw new Error(
          "Admin session expired. Dobara login karo."
        );

      }


      const extension =
        file.name.includes(".")
        ? file.name.split(".").pop()
        : "file";


      const safeName =
        file.name
          .replace(/[^a-zA-Z0-9._-]/g,"-");


      const filePath =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2,8) +
        "-" +
        safeName;


      const {
        error:uploadError
      } =
      await supabaseClient.storage
        .from("stj-media")
        .upload(
          filePath,
          file,
          {
            cacheControl:"3600",
            upsert:false
          }
        );


      if(uploadError){

        throw uploadError;

      }


      const {
        data:publicData
      } =
      supabaseClient.storage
        .from("stj-media")
        .getPublicUrl(filePath);


      const mediaUrl =
        publicData.publicUrl;


      const mediaType =
        file.type.startsWith("video/")
        ? "video"
        : "image";


      const {
        error:dbError
      } =
      await supabaseClient
        .from("portfolio")
        .insert({

          title:title,
          category:category,
          description:description || null,
          media_url:mediaUrl,
          media_type:mediaType

        });


      if(dbError){

        throw dbError;

      }


      message.className = "success";
      message.innerText =
        "✅ Work successfully published!";


      titleInput.value = "";
      descriptionInput.value = "";
      mediaFile.value = "";
      fileName.innerText = "";


      await loadWorks();


    }catch(err){

      console.error(err);

      message.className = "error";

      message.innerText =
        "Upload failed: " +
        (err.message || "Unknown error");

    }


    uploadBtn.disabled = false;
    uploadBtn.innerText =
      "Upload & Publish";

  }
);


async function loadWorks(){

  workList.innerHTML =
    '<p class="muted">Loading...</p>';


  const {
    data,
    error
  } =
  await supabaseClient
    .from("portfolio")
    .select("*")
    .order(
      "created_at",
      {ascending:false}
    );


  if(error){

    workList.innerHTML =
      `<p class="error">
        ${escapeHTML(error.message)}
      </p>`;

    return;
  }


  if(!data || !data.length){

    workList.innerHTML =
      `<p class="muted">
        Abhi koi work publish nahi hua.
      </p>`;

    return;
  }


  workList.innerHTML =
    data.map(item => {

      const media =
        item.media_type === "video"

        ? `
          <video
            class="work-media"
            src="${escapeHTML(item.media_url)}"
            controls
            playsinline>
          </video>
        `

        : `
          <img
            class="work-media"
            src="${escapeHTML(item.media_url)}"
            alt="${escapeHTML(item.title)}">
        `;


      return `
        <div class="work">

          ${media}

          <div class="work-info">

            <small>
              ${escapeHTML(item.category)}
            </small>

            <h3>
              ${escapeHTML(item.title)}
            </h3>

            ${
              item.description
              ? `<p class="muted">
                   ${escapeHTML(item.description)}
                 </p>`
              : ""
            }

          </div>

        </div>
      `;

    }).join("");

}


function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


supabaseClient.auth.onAuthStateChange(
  function(event,session){

    if(session){

      showDashboard();

    }else{

      showLogin();

    }

  }
);


checkUser();

</script>

</body>
</html>
