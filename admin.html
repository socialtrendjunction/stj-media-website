<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STJ Media — Admin</title><link rel="stylesheet" href="admin.css"></head>
<body>
<div class="wrap">
<header><a href="index.html">← STJ Media</a><span>ADMIN PANEL</span></header>
<section id="login" class="card">
  <img src="stj-logo.png" alt="STJ">
  <p class="eyebrow">STJ MEDIA · PRIVATE AREA</p><h1>Admin Login</h1><p class="muted">Manage your portfolio from this device.</p>
  <form id="loginForm"><input id="user" autocomplete="username" placeholder="Username" required><input id="pass" type="password" autocomplete="current-password" placeholder="Password" required><button>Login</button><p id="loginMsg"></p></form>
</section>
<section id="dashboard" class="hidden">
  <div class="dash-head"><div><p class="eyebrow">STJ MEDIA</p><h1>Content Dashboard</h1></div><button id="logout" class="outline">Logout</button></div>
  <div class="card">
   <h2>Add New Work</h2><p class="muted">This version stores portfolio items in this browser. For public cross-device uploads, connect Supabase/GitHub storage as the next step.</p>
   <form id="workForm" class="grid">
    <input id="title" placeholder="Project name" required>
    <select id="category"><option value="design">Graphic Design</option><option value="shoot">Photo & Video</option><option value="edit">Video Editing</option></select>
    <input id="media" type="file" accept="image/*,video/*" required>
    <button>Add to Portfolio</button>
   </form>
  </div>
  <div class="card"><h2>Saved Work</h2><div id="saved"></div></div>
</section>
</div>
<script src="admin.js"></script>
</body></html>
