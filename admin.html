<script>
const SUPABASE_URL = "https://acuszwigwpfrumkhtdeh.supabase.co";
const SUPABASE_KEY = "sb_publishable_nXq7buM0ASGpEvRq_12VDQ_yLUkGIo2";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.addEventListener("DOMContentLoaded", () => {

  const loginForm = document.getElementById("login-form");
  const loginScreen = document.getElementById("login-screen");
  const dashboard = document.getElementById("dashboard");
  const loginError = document.getElementById("login-error");
  const loginBtn = document.getElementById("login-btn");

  function showDashboard() {
    if (loginScreen) loginScreen.classList.add("hidden");
    if (dashboard) dashboard.classList.remove("hidden");
  }

  function showLogin() {
    if (loginScreen) loginScreen.classList.remove("hidden");
    if (dashboard) dashboard.classList.add("hidden");
  }

  /* LOGIN */
  if (loginForm) {
    loginForm.addEventListener("submit", async (e) => {

      // VERY IMPORTANT — page refresh rokta hai
      e.preventDefault();
      e.stopPropagation();

      loginError.textContent = "";

      const email =
        document.getElementById("login-email").value.trim();

      const password =
        document.getElementById("login-password").value;

      if (!email || !password) {
        loginError.textContent =
          "Email aur password enter karo.";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          console.error(error);
          loginError.textContent = error.message;
          return;
        }

        if (data && data.session) {
          document.getElementById("login-password").value = "";
          showDashboard();
        } else {
          loginError.textContent =
            "Login nahi hua. Dobara try karo.";
        }

      } catch (error) {

        console.error(error);

        loginError.textContent =
          error.message || "Login failed.";

      } finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";

      }
    });
  }

  /* CHECK ALREADY LOGGED IN */
  async function checkSession() {

    try {

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        console.error(error);
        showLogin();
        return;
      }

      if (data && data.session) {
        showDashboard();
      } else {
        showLogin();
      }

    } catch (error) {

      console.error(error);
      showLogin();

    }
  }

  /* LOGOUT */
  const logoutBtn = document.getElementById("logout-btn");

  if (logoutBtn) {

    logoutBtn.addEventListener("click", async () => {

      await supabaseClient.auth.signOut();

      showLogin();

      document.getElementById("login-email").value = "";
      document.getElementById("login-password").value = "";

    });

  }

  /* AUTH CHANGE */
  supabaseClient.auth.onAuthStateChange((event, session) => {

    if (session) {
      showDashboard();
    } else {
      showLogin();
    }

  });

  checkSession();

});
</script>
